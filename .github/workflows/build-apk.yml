name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install required SDK platform & build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Surface failure as annotations
        if: failure()
        run: |
          echo "----- key error lines -----"
          grep -E "error:|FAILURE|Execution failed|Caused by|^e: |^> Task .*FAILED" build.log | tail -n 10 > errors.txt || true
          if [ ! -s errors.txt ]; then
            tail -n 10 build.log > errors.txt
          fi
          while IFS= read -r line; do
            safe=$(echo "$line" | cut -c1-400)
            echo "::error::${safe}"
          done < errors.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: downtime-log-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
